[project]
name = "garys-economics-chatbot"
version = "0.2.0"
description = "A chatbot that answers economics questions by referencing Gary's Economics YouTube videos, through the Gary's Economics MCP server."
license = "GPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = [
    "discord.py",
    "langchain",
    "langfuse>=3,<4",
    "langchain-openai",
    "langchain-ollama",
    "mcp>=2,<3",
    "ollama",

    "pydantic-settings",
    "python-dotenv",
    "python-telegram-bot",
    "chonkie",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[tool.setuptools]
py-modules = ["config"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
pythonpath = ["./src"]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "langfuse: tests that require a running Langfuse server and credentials",
    "mcp_server: tests that require a running MCP server (MCP_SERVER_URL)",
]
# Filter third-party warnings we can't fix:
# - audioop: discord.py imports it for voice support, deprecated in Python 3.13
filterwarnings = [
    "ignore:'audioop' is deprecated:DeprecationWarning",
]
