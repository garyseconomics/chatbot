services:
  telegram-bot:
    image: ghcr.io/garyseconomics/chatbot:latest
    build: .
    env_file:
      - .env
    volumes:
      - ./providers.json:/app/providers.json:ro
    restart: unless-stopped
    command: ["python", "-m", "interfaces.telegram_bot"]
    tty: true

  discord-bot:
    image: ghcr.io/garyseconomics/chatbot:latest
    build: .
    env_file:
      - .env
    volumes:
      - ./providers.json:/app/providers.json:ro
    restart: unless-stopped
    command: ["python", "-m", "interfaces.discord_bot"]
    tty: true