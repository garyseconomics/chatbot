name: PR validation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    # The keys live in the "test" environment, which needs a reviewer's approval
    # before a run can use them.
    environment: test

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - name: Build and run dev container task
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca  # v0.3
        # Values from the "test" environment, for this step only
        env:
          OLLAMA_CLOUD_API_KEY: ${{ secrets.OLLAMA_CLOUD_API_KEY }}
          MCP_SERVER_URL: ${{ secrets.MCP_SERVER_URL }}
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
          LANGFUSE_BASE_URL: ${{ secrets.LANGFUSE_BASE_URL }}
          LANGFUSE_TRACING_ENABLED: ${{ vars.LANGFUSE_TRACING_ENABLED }}
          LANGFUSE_MESSAGE_TRACING_ENABLED: ${{ vars.LANGFUSE_MESSAGE_TRACING_ENABLED }}
          LANGFUSE_TRACING_ENVIRONMENT: ${{ vars.LANGFUSE_TRACING_ENVIRONMENT }}
          LANGFUSE_TEST_TRACING_ENVIRONMENT: ${{ vars.LANGFUSE_TEST_TRACING_ENVIRONMENT }}
          OTEL_SERVICE_NAME: ${{ vars.OTEL_SERVICE_NAME }}
          TEST_CHAT_PROVIDER: ${{ vars.TEST_CHAT_PROVIDER }}
        with:
          push: never
          # The tests run inside the dev container, which doesn't see the step's
          # variables unless they're listed here by name.
          env: |
            OLLAMA_CLOUD_API_KEY
            MCP_SERVER_URL
            LANGFUSE_PUBLIC_KEY
            LANGFUSE_SECRET_KEY
            LANGFUSE_BASE_URL
            LANGFUSE_TRACING_ENABLED
            LANGFUSE_MESSAGE_TRACING_ENABLED
            LANGFUSE_TRACING_ENVIRONMENT
            LANGFUSE_TEST_TRACING_ENVIRONMENT
            OTEL_SERVICE_NAME
            TEST_CHAT_PROVIDER
          runCmd: pytest

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4.2.0

      - name: Build image without publishing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          push: false
